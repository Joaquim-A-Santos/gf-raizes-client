
# DXVK CONF - ALTO RENDIMIENTO PARA AMD RX 7900 GRE + RYZEN 7 9800X3D
# Enfoque: máximo rendimiento y mínima latencia para Grand Fantasia

# Habilita compilación asíncrona de shaders para reducir stutter y mejorar FPS
dxvk.enableAsync = true

# Usa múltiples hilos de compilación para shaders (CPU de 8 núcleos / 16 hilos)
dxvk.numCompilerThreads = 10

# Desactiva vSync para evitar limitaciones de FPS e input lag
dxgi.syncInterval = 0
dxgi.maxFrameLatency = 0

# Activar funciones modernas de la GPU que mejoran la ejecución de shaders
dxvk.useRawSsbo = true
dxvk.enableSubgroups = true

# HUD de FPS desactivado por limpieza visual (puedes activarlo con: dxvk.hud = fps)
dxvk.hud = fps
